name: Pymes V3 CI

on:
  pull_request:
    paths:
      - "v3/**"
      - "AGENTS.md"
      - ".github/dependencies/open-accounting.env"
      - ".github/workflows/v3-ci.yml"
  push:
    branches: [main]
    paths:
      - "v3/**"
      - "AGENTS.md"
      - ".github/dependencies/open-accounting.env"
      - ".github/workflows/v3-ci.yml"

permissions:
  contents: read

concurrency:
  group: pymes-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Pymes
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read and validate Open Accounting pin
        id: accounting-pin
        shell: bash
        run: |
          set -euo pipefail
          pin_file=".github/dependencies/open-accounting.env"
          repository="$(sed -n 's/^OPEN_ACCOUNTING_REPOSITORY=//p' "${pin_file}")"
          revision="$(sed -n 's/^OPEN_ACCOUNTING_REF=//p' "${pin_file}")"
          if [[ ! "${repository}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "invalid Open Accounting repository pin" >&2
            exit 1
          fi
          if [[ ! "${revision}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Open Accounting must be pinned to one full commit SHA" >&2
            exit 1
          fi
          echo "repository=${repository}" >>"${GITHUB_OUTPUT}"
          echo "revision=${revision}" >>"${GITHUB_OUTPUT}"

      - name: Checkout Open Accounting fork
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.accounting-pin.outputs.repository }}
          ref: ${{ steps.accounting-pin.outputs.revision }}
          path: .deps/open-accounting
          persist-credentials: false

      - name: Verify exact Open Accounting revision
        working-directory: .deps/open-accounting
        env:
          EXPECTED_REVISION: ${{ steps.accounting-pin.outputs.revision }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_REVISION}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: |
            v3/backend/go.sum
            .deps/open-accounting/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: v3/fiscal-adapter/package-lock.json

      - name: Run V3 CI
        working-directory: v3
        env:
          ACCOUNTING_BUILD_CONTEXT: ${{ github.workspace }}/.deps/open-accounting
        run: make ci

      - name: Stop stack
        if: always()
        working-directory: v3
        env:
          ACCOUNTING_BUILD_CONTEXT: ${{ github.workspace }}/.deps/open-accounting
        run: docker compose down --volumes --remove-orphans
