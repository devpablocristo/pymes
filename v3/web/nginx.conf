server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  charset utf-8;

  # A tagged zero-traffic revision is addressable by Cloud Run. Keep that
  # pretraffic hostname closed unless the release verifier presents the
  # ephemeral per-release capability. Stable service traffic is unaffected.
  set $pymes_preflight_gate "";
  if ($host ~* "^${PYMES_PREFLIGHT_TAG}---") {
    set $pymes_preflight_gate "required";
  }
  if ($http_x_pymes_preflight_token = "${PYMES_PREFLIGHT_TOKEN}") {
    set $pymes_preflight_gate "${pymes_preflight_gate}-authorized";
  }
  if ($pymes_preflight_gate = "required") {
    return 404;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://*.clerk.accounts.dev https://*.clerk.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://img.clerk.com https://*.clerk.com; font-src 'self' data:; connect-src 'self' https:; frame-src https://*.clerk.accounts.dev https://*.clerk.com; form-action 'self' https://*.clerk.accounts.dev https://*.clerk.com; upgrade-insecure-requests" always;
  add_header X-Pymes-Release "${PYMES_RELEASE_MARKER}" always;

  location /api/ {
    proxy_http_version 1.1;
    proxy_pass ${PYMES_API_UPSTREAM};
    proxy_ssl_server_name on;
    proxy_hide_header X-Pymes-Release;
    proxy_set_header Host $proxy_host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Pymes-Preflight-Token "${PYMES_PREFLIGHT_TOKEN}";
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /readyz {
    access_log off;
    default_type text/plain;
    return 200 "ready\n";
  }

  location ~* \.(?:css|js|map|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
    try_files $uri =404;
    expires 1y;
    # nginx does not inherit server-level add_header directives when a
    # location declares one of its own. Keep the security policy on immutable
    # assets as well as the cache policy.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://*.clerk.accounts.dev https://*.clerk.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://img.clerk.com https://*.clerk.com; font-src 'self' data:; connect-src 'self' https:; frame-src https://*.clerk.accounts.dev https://*.clerk.com; form-action 'self' https://*.clerk.accounts.dev https://*.clerk.com; upgrade-insecure-requests" always;
    add_header Cache-Control "public, immutable";
    add_header X-Pymes-Release "${PYMES_RELEASE_MARKER}" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    # See the inheritance note above. HTML and every SPA fallback must retain
    # the same response hardening while remaining uncacheable.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' https://*.clerk.accounts.dev https://*.clerk.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://img.clerk.com https://*.clerk.com; font-src 'self' data:; connect-src 'self' https:; frame-src https://*.clerk.accounts.dev https://*.clerk.com; form-action 'self' https://*.clerk.accounts.dev https://*.clerk.com; upgrade-insecure-requests" always;
    add_header Cache-Control "no-store";
    add_header X-Pymes-Release "${PYMES_RELEASE_MARKER}" always;
  }
}
