name: v2-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  v2-ci:
    name: v2-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable v1 snapshot
        run: .github/scripts/verify-v1-archive.sh v1-final
      - name: Verify v2 placeholder
        run: test -f v2/README.md

  required-check-transition:
    name: review-notifications-e2e
    runs-on: ubuntu-latest
    steps:
      - run: echo "Transitional required check; replaced by v2-ci after archive cutover."
