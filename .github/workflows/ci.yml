name: v2-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  v2-ci:
    name: v2-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable v1 snapshot
        run: .github/scripts/verify-v1-archive.sh v1-final
      - name: Verify frozen v1 tree
        run: .github/scripts/check-v1-frozen.sh
      - name: Verify v2 placeholder
        run: test -f v2/README.md
