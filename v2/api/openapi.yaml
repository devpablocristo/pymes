          minimum: 1
        issue_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
          nullable: true
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        exchange_rate:
          $ref: "#/components/schemas/DecimalAmount"
        exchange_rate_date:
          type: string
          format: date
        exchange_rate_source:
          type: string
          minLength: 1
          maxLength: 80
        source_reference:
          type: string
          maxLength: 160
        associated_purchase_voucher_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Factura de compra original. Es obligatoria para notas de crédito y
            débito y debe pertenecer al mismo proveedor, ambiente y letra.
        lines:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/FiscalPurchaseLineInput"
        taxes:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/FiscalPurchaseTaxInput"
    FiscalPurchaseVoucher:
      type: object
      additionalProperties: false
      required:
        [id, environment, supplier_id, supplier_tax_id, supplier_name, voucher_type, point_of_sale, voucher_number, issue_date, currency, exchange_rate, net_amount, exempt_amount, non_taxed_amount, vat_amount, other_taxes_amount, withholding_amount, perception_amount, total_amount, version, created_at]
      properties:
        id:
          type: string
          format: uuid
        environment:
          $ref: "#/components/schemas/FiscalEnvironment"
        supplier_id:
          type: string
          format: uuid
        supplier_tax_id:
          type: string
        supplier_name:
          type: string
        voucher_type:
          type: integer
        point_of_sale:
          type: integer
        voucher_number:
          type: integer
          format: int64
        issue_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
          nullable: true
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        exchange_rate:
          $ref: "#/components/schemas/DecimalAmount"
        net_amount:
          $ref: "#/components/schemas/DecimalAmount"
        exempt_amount:
          $ref: "#/components/schemas/DecimalAmount"
        non_taxed_amount:
          $ref: "#/components/schemas/DecimalAmount"
        vat_amount:
          $ref: "#/components/schemas/DecimalAmount"
        other_taxes_amount:
          $ref: "#/components/schemas/DecimalAmount"
        withholding_amount:
          $ref: "#/components/schemas/DecimalAmount"
        perception_amount:
          $ref: "#/components/schemas/DecimalAmount"
        total_amount:
          $ref: "#/components/schemas/DecimalAmount"
        version:
          type: integer
          format: int64
        journal_entry_id:
          type: string
          format: uuid
          nullable: true
        associated_purchase_voucher_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
    FiscalPurchaseVoucherList:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FiscalPurchaseVoucher"
        page:
          $ref: "#/components/schemas/PageInfo"
    IVASimpleReport:
      type: object
      additionalProperties: false
      required: [period, sales_net, output_vat, purchases_net, input_vat, withholdings, perceptions, balance, validation_errors]
      properties:
        period:
          type: string
        sales_net:
          $ref: "#/components/schemas/DecimalAmount"
        output_vat:
          $ref: "#/components/schemas/DecimalAmount"
        purchases_net:
          $ref: "#/components/schemas/DecimalAmount"
        input_vat:
          $ref: "#/components/schemas/DecimalAmount"
        withholdings:
          $ref: "#/components/schemas/DecimalAmount"
        perceptions:
          $ref: "#/components/schemas/DecimalAmount"
        balance:
          $ref: "#/components/schemas/DecimalAmount"
        sales_file:
          type: string
          description: Archivo de trabajo codificado en base64.
        purchases_file:
          type: string
          description: Archivo de trabajo codificado en base64.
        validation_errors:
          type: array
          items:
            type: string
    IVASimpleWorkflowStatus:
      type: string
      enum: [draft, closed, exported]
    IVASimplePrepareInput:
      type: object
      additionalProperties: false
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: >-
            Obligatoria al volver a preparar un borrador existente; debe
            omitirse al crear el período por primera vez.
        opening_balance:
          $ref: "#/components/schemas/DecimalAmount"
    IVASimpleTransitionInput:
      type: object
      additionalProperties: false
      required: [version, reason]
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 500
    IVASimpleExportSummary:
      type: object
      additionalProperties: false
      required:
        [id, export_version, filename, media_type, sha256, created_at]
      properties:
        id:
          type: string
          format: uuid
        export_version:
          type: integer
          minimum: 1
        filename:
          type: string
        media_type:
          type: string
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        created_at:
          type: string
          format: date-time
    IVASimpleExportArtifact:
      allOf:
        - $ref: "#/components/schemas/IVASimpleExportSummary"
        - type: object
          additionalProperties: false
          required: [content_base64]
          properties:
            content_base64:
              type: string
              format: byte
    IVASimpleWorkflowPeriod:
      type: object
      additionalProperties: false
      required:
        - id
        - period
        - environment
        - status
        - opening_balance
        - report
        - version
        - exports
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        period:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        environment:
          $ref: "#/components/schemas/FiscalEnvironment"
        status:
          $ref: "#/components/schemas/IVASimpleWorkflowStatus"
        opening_balance:
          $ref: "#/components/schemas/DecimalAmount"
        closing_balance:
          $ref: "#/components/schemas/DecimalAmount"
          nullable: true
        report:
          $ref: "#/components/schemas/IVASimpleReport"
        version:
          type: integer
          format: int64
          minimum: 1
        exports:
          type: array
          items:
            $ref: "#/components/schemas/IVASimpleExportSummary"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          nullable: true
        exported_at:
          type: string
          format: date-time
          nullable: true
    LifecycleCommandInput:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500
    UpdateMemberInput:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          $ref: "#/components/schemas/AssignableRole"
    TransferOwnershipInput:
      type: object
      required: [member_id]
      additionalProperties: false
      properties:
        member_id:
          type: string
          format: uuid
    CreateInvitationInput:
      type: object
      required: [email, role]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        role:
          $ref: "#/components/schemas/AssignableRole"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              pattern: "^[A-Z][A-Z0-9_]*$"
              description: >-
                Código estable. IAM usa `AUTH_INVALID_TOKEN`,
                `AUTH_ORGANIZATION_REQUIRED`, `IAM_MEMBERSHIP_REQUIRED`,
                `IAM_FORBIDDEN`, `IAM_ROLE_CONFLICT`,
                `IAM_INVITATION_PENDING`, `AUTH_PROVIDER_RATE_LIMITED`,
                `AUTH_NOT_CONFIGURED`, `AUTH_PROVIDER_UNAVAILABLE`,
                `IAM_UNAVAILABLE`, `REQUEST_INVALID`,
                `IDEMPOTENCY_KEY_CONFLICT`, `IDEMPOTENCY_IN_PROGRESS`,
                `WEBHOOK_INVALID_PAYLOAD` y
                `WEBHOOK_INVALID_SIGNATURE`.
            message:
              type: string
            request_id:
              type: string
            details:
              type: object
              additionalProperties: true
security:
  - bearerAuth: []
