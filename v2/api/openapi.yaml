openapi: 3.0.3
info:
  title: Pymes v2 API
  version: 0.1.0
  description: API horizontal de Pymes v2. La organización activa siempre proviene del token.
servers:
  - url: /
tags:
  - name: Runtime
  - name: Identity
  - name: Administration
  - name: Organization
  - name: Team
  - name: Accounting
  - name: Fiscal
  - name: Webhooks
paths:
  /api/v1/runtime-config:
    get:
      operationId: getRuntimeConfig
      tags: [Runtime]
      security: []
      responses:
        "200":
          description: Configuración pública necesaria para iniciar la web.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConfig"
  /api/v1/session:
    get:
      operationId: getCurrentSession
      tags: [Identity]
      responses:
        "200":
          description: Identidad, organización y permisos efectivos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/organizations:
    get:
      operationId: listMyOrganizations
      tags: [Identity]
      description: >-
        Lista las organizaciones locales activas del subject autenticado. No
        requiere una organización activa en el token y nunca crea
        organizaciones descubiertas únicamente desde Clerk.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Organizaciones locales activas del usuario autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/admin/tenants:
    get:
      operationId: listAdminTenants
      tags: [Administration]
      description: Lista global de tenants; requiere rol global owner.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/OrganizationStatus"
        - name: lifecycle_state
          in: query
          schema:
            $ref: "#/components/schemas/LifecycleState"
        - name: query
          in: query
          schema:
            type: string
            maxLength: 120
      responses:
        "200":
          description: Tenants visibles para el owner global.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTenantList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createAdminTenant
      tags: [Administration]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminTenantInput"
      responses:
        "202":
          description: Provisionamiento local confirmado y sincronización con Clerk en curso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/admin/tenants/{tenant_id}:
    get:
      operationId: getAdminTenant
      tags: [Administration]
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: Tenant global.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTenant"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      operationId: updateAdminTenant
      tags: [Administration]
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminTenantInput"
      responses:
        "202":
          description: Tenant actualizado localmente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/admin/tenants/{tenant_id}/archive:
    post:
      operationId: archiveAdminTenant
      tags: [Administration]
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/LifecycleCommand"
      responses:
        "204":
          description: Tenant archivado y excluido de los flujos activos.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/admin/tenants/{tenant_id}/unarchive:
    post:
      operationId: unarchiveAdminTenant
      tags: [Administration]
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/LifecycleCommand"
      responses:
        "204":
          description: Tenant desarchivado y nuevamente activo.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/admin/tenants/{tenant_id}/trash:
    post:
      operationId: trashAdminTenant
      tags: [Administration]
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/LifecycleCommand"
      responses:
        "204":
          description: Tenant movido a la papelera.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/admin/tenants/{tenant_id}/restore:
    post:
      operationId: restoreAdminTenant
      tags: [Administration]
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/LifecycleCommand"
      responses:
        "204":
          description: Tenant restaurado desde la papelera.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/admin/tenants/{tenant_id}/purge:
    delete:
      operationId: purgeAdminTenant
      tags: [Administration]
      description: Purga irreversible; sólo admite tenants en la papelera.
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/LifecycleCommand"
      responses:
        "204":
          description: Tenant purgado.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/admin/users:
    get:
      operationId: listAdminUsers
      tags: [Administration]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/UserStatus"
        - name: lifecycle_state
          in: query
          schema:
            $ref: "#/components/schemas/LifecycleState"
        - name: query
          in: query
          schema:
            type: string
            maxLength: 120
      responses:
        "200":
          description: Usuarios globales.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createAdminUser
      tags: [Administration]
      description: Invita por email a un usuario y lo asigna a un tenant.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminUserInput"
      responses:
        "202":
          description: Invitación creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/admin/users/{user_id}:
    get:
      operationId: getAdminUser
      tags: [Administration]
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: Usuario global.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      operationId: updateAdminUser
      tags: [Administration]
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminUserInput"
      responses:
        "202":
          description: Usuario actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/admin/users/{user_id}/archive:
    post:
      operationId: archiveAdminUser
      tags: [Administration]
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/LifecycleCommand"
      responses:
        "204":
          description: Usuario archivado y acceso cortado.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/admin/users/{user_id}/unarchive:
    post:
      operationId: unarchiveAdminUser
      tags: [Administration]
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/LifecycleCommand"
      responses:
        "204":
          description: Usuario desarchivado.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/admin/users/{user_id}/trash:
    post:
      operationId: trashAdminUser
      tags: [Administration]
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/LifecycleCommand"
      responses:
        "204":
          description: Usuario movido a la papelera y acceso cortado.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/admin/users/{user_id}/restore:
    post:
      operationId: restoreAdminUser
      tags: [Administration]
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/LifecycleCommand"
      responses:
        "204":
          description: Usuario restaurado desde la papelera.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/admin/users/{user_id}/purge:
    delete:
      operationId: purgeAdminUser
      tags: [Administration]
      description: Purga irreversible; exige usuario en la papelera.
      parameters:
        - $ref: "#/components/parameters/UserID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/LifecycleCommand"
      responses:
        "204":
          description: Usuario purgado.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/organization:
    patch:
      operationId: updateCurrentOrganization
      tags: [Organization]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationInput"
      responses:
        "202":
          description: Actualización local confirmada y sincronización remota en curso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/sessions:
    get:
      operationId: listMySessions
      tags: [Identity]
      description: >-
        Lista exclusivamente sesiones cuyo provider user coincide con el
        subject autenticado. No requiere una organización activa.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Sesiones pertenecientes al usuario autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/sessions/{session_id}:
    delete:
      operationId: revokeMySession
      tags: [Identity]
      description: >-
        Revoca una sesión sólo después de comprobar en servidor que pertenece
        al subject autenticado. Repetir la revocación es exitoso.
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Sesión revocada o ya inexistente.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/team/members:
    get:
      operationId: listTeamMembers
      tags: [Team]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Miembros activos de la organización del token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/team/members/{member_id}:
    patch:
      operationId: updateTeamMember
      tags: [Team]
      parameters:
        - $ref: "#/components/parameters/MemberID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberInput"
      responses:
        "202":
          description: Cambio aceptado; la sincronización con Clerk puede continuar en background.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: removeTeamMember
      tags: [Team]
      parameters:
        - $ref: "#/components/parameters/MemberID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Acceso local bloqueado y remoción remota encolada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/team/members/{member_id}/business-permissions:
    get:
      operationId: getTeamMemberBusinessPermissions
      tags: [Team]
      description: >-
        Devuelve únicamente las delegaciones explícitas de gestión contable y
        fiscal del miembro. Los permisos propios de owner/admin se derivan del
        rol y no se duplican aquí.
      parameters:
        - $ref: "#/components/parameters/MemberID"
      responses:
        "200":
          description: Delegaciones explícitas vigentes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberBusinessPermissions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      operationId: updateTeamMemberBusinessPermissions
      tags: [Team]
      description: >-
        Reemplaza el conjunto acotado de delegaciones del miembro dentro de la
        organización activa. No cambia su rol general.
      parameters:
        - $ref: "#/components/parameters/MemberID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberBusinessPermissionsInput"
      responses:
        "200":
          description: Delegaciones actualizadas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberBusinessPermissions"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/team/ownership-transfer:
    post:
      operationId: transferOwnership
      tags: [Team]
      deprecated: true
      description: >-
        Compatibilidad temporal. La propiedad ya no pertenece al tenant:
        `owner` es un rol global de Pymes administrado mediante `/api/v1/admin/users`.
        Este endpoint siempre responde `409`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferOwnershipInput"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/team/invitations:
    get:
      operationId: listTeamInvitations
      tags: [Team]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/InvitationStatus"
      responses:
        "200":
          description: Invitaciones de la organización activa.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createTeamInvitation
      tags: [Team]
