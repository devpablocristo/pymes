name: Legacy immutability gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pymes-legacy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  legacy-read-only:
    # Keep this check context until branch protection is migrated; it no
    # longer builds or tests v2.
    name: v2-ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject changes to immutable v1/v2
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: .github/scripts/check-legacy-frozen.sh "${BASE_SHA}" "${HEAD_SHA}"
