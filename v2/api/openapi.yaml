  /webhooks/clerk:
    post:
      operationId: receiveClerkWebhook
      tags: [Webhooks]
      description: >-
        Entrada firmada de Clerk/Svix. No usa bearerAuth; las tres cabeceras de
        firma son obligatorias y la firma se valida sobre el body sin alterar.
      security:
        - svixId: []
          svixTimestamp: []
          svixSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "204":
          description: Evento verificado y aceptado en el inbox; los duplicados también se reconocen.
        "400":
          $ref: "#/components/responses/WebhookBadRequest"
        "401":
          $ref: "#/components/responses/WebhookUnauthorized"
        "503":
          $ref: "#/components/responses/WebhookUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de sesión Clerk; la organización activa, cuando se exige, vive en sus claims verificados.
    svixId:
      type: apiKey
      in: header
      name: svix-id
      description: Identificador firmado del evento Clerk/Svix.
    svixTimestamp:
      type: apiKey
      in: header
      name: svix-timestamp
      description: Timestamp firmado del evento Clerk/Svix.
    svixSignature:
      type: apiKey
      in: header
      name: svix-signature
      description: Firma Clerk/Svix calculada sobre el body original.
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 255
    SessionID:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    MemberID:
      name: member_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationID:
      name: invitation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TenantID:
      name: tenant_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserID:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AccountID:
      name: account_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DraftID:
      name: draft_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EntryID:
      name: entry_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PeriodID:
      name: period_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FinancialAccountID:
      name: financial_account_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StatementImportID:
      name: statement_import_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReconciliationID:
      name: reconciliation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VoucherID:
      name: voucher_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBodies:
    LifecycleCommand:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LifecycleCommandInput"
  responses:
    BadRequest:
      description: Request inválido (`REQUEST_INVALID`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Credencial ausente o inválida (`AUTH_INVALID_TOKEN`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: >-
        Identidad válida sin acceso suficiente
        (`AUTH_ORGANIZATION_REQUIRED`, `IAM_MEMBERSHIP_REQUIRED` o
        `IAM_FORBIDDEN`).
      content:
        application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Recurso inexistente o no visible (`RESOURCE_NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: >-
        Conflicto con el estado actual (`VERSION_CONFLICT`,
        `RESOURCE_DUPLICATE`, `INVALID_TRANSITION`,
        `ACCOUNTING_PERIOD_CLOSED`, `RESOURCE_IMMUTABLE`,
        `FISCAL_AUTHORIZATION_UNCERTAIN`, `FISCAL_PRODUCTION_NOT_READY`,
        `IAM_ROLE_CONFLICT`,
        `IAM_INVITATION_PENDING`, `IDEMPOTENCY_KEY_CONFLICT` o
        `IDEMPOTENCY_IN_PROGRESS`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unprocessable:
      description: >-
        La operación es sintácticamente válida pero no satisface una garantía
        contable (`ACCOUNTING_UNBALANCED`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Clerk limitó temporalmente la operación (`AUTH_PROVIDER_RATE_LIMITED`).
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unavailable:
      description: >-
        Autenticación no configurada (`AUTH_NOT_CONFIGURED`) o proveedor
        temporalmente indisponible (`AUTH_PROVIDER_UNAVAILABLE`). Una falla
        temporal de la autoridad IAM local usa `IAM_UNAVAILABLE`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    WebhookBadRequest:
      description: Payload de webhook inválido (`WEBHOOK_INVALID_PAYLOAD`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    WebhookUnauthorized:
      description: Firma Clerk/Svix ausente o inválida (`WEBHOOK_INVALID_SIGNATURE`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    WebhookUnavailable:
      description: >-
        Secreto de webhook no configurado (`AUTH_NOT_CONFIGURED`) o inbox IAM
        temporalmente indisponible (`IAM_UNAVAILABLE`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Role:
      type: string
      description: Rol efectivo; `owner` es global y las membresías tenant usan `admin|member`.
      enum: [owner, admin, member]
    ProductRole:
      type: string
      description: Rol global del producto; `owner` tiene autoridad sobre todos los tenants y usuarios.
      enum: [owner, user]
    UserStatus:
      type: string
      enum: [active, disabled]
    LifecycleState:
      type: string
      description: Estado canónico administrado por Platform lifecycle.
      enum: [active, archived, trashed]
    Permission:
      type: string
      description: Permiso IAM efectivo derivado del rol efectivo.
      enum:
        - organization:view
        - organization:update
        - team:view
        - team:member:update
        - team:member:remove
        - team:invitation:create
        - team:invitation:manage
        - sessions:manage:self
        - accounting:view
        - accounting:manage
        - fiscal:view
        - fiscal:manage
    AssignableRole:
      type: string
      description: >-
        Roles administrables dentro de un tenant. `owner` es un rol global del
        producto y no forma parte de una membresía.
      enum: [admin, member]
    OrganizationStatus:
      type: string
      enum: [provisioning, active, suspended, disabled]
    SyncStatus:
      type: string
      enum: [queued, pending, synced, failed]
    MembershipStatus:
      type: string
      enum: [pending, active, removed, quarantined]
    InvitationStatus:
      type: string
      description: Ciclo de vida local; el estado de sincronización se expone por separado.
      enum: [pending, accepted, revoked, expired]
    SessionStatus:
      type: string
      description: Estado normalizado de la sesión informado por Clerk.
      enum: [abandoned, active, pending, ended, expired, removed, replaced, revoked]
    RuntimeConfig:
      type: object
      required: [auth]
      additionalProperties: false
      properties:
        auth:
          type: object
          required: [provider, configured]
          additionalProperties: false
          properties:
            provider:
              type: string
              enum: [clerk]
            configured:
              type: boolean
            publishable_key:
              type: string
              description: Presente si y sólo si `configured` es true.
    User:
      type: object
      required: [id, email, display_name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        avatar_url:
          type: string
          format: uri
          nullable: true
    Organization:
      type: object
      required: [id, name, slug, status, role, sync_status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          $ref: "#/components/schemas/OrganizationStatus"
        role:
          description: Rol local de la membresía del usuario en esta organización.
          allOf:
            - $ref: "#/components/schemas/Role"
        switch_key:
          type: string
          description: Referencia opaca usada únicamente con Clerk.setActive().
        sync_status:
          $ref: "#/components/schemas/SyncStatus"
    AdminTenant:
      type: object
      additionalProperties: false
      required: [id, name, slug, status, lifecycle_state, sync_status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        status:
          $ref: "#/components/schemas/OrganizationStatus"
        lifecycle_state:
          $ref: "#/components/schemas/LifecycleState"
        archived_at:
          type: string
          format: date-time
          nullable: true
        trashed_at:
          type: string
          format: date-time
          nullable: true
        purge_after:
          type: string
          format: date-time
          nullable: true
        sync_status:
          $ref: "#/components/schemas/SyncStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AdminMembership:
      type: object
      additionalProperties: false
      required: [id, tenant_id, tenant_name, role, status]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        tenant_name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/MembershipStatus"
    AdminUser:
      type: object
      additionalProperties: false
      required:
        [id, email, email_verified, display_name, status, lifecycle_state, product_role, memberships, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        display_name:
          type: string
        avatar_url:
          type: string
          format: uri
          nullable: true
        status:
          $ref: "#/components/schemas/UserStatus"
        lifecycle_state:
          $ref: "#/components/schemas/LifecycleState"
        archived_at:
          type: string
          format: date-time
          nullable: true
        trashed_at:
          type: string
          format: date-time
          nullable: true
        purge_after:
          type: string
          format: date-time
          nullable: true
        product_role:
          $ref: "#/components/schemas/ProductRole"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/AdminMembership"
        version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Membership:
      type: object
      required: [id, role, status]
      properties:
        id:
          type: string
          format: uuid
        role:
          description: Rol local autoritativo almacenado en PostgreSQL.
          allOf:
            - $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/MembershipStatus"
    CurrentSession:
      type: object
      required: [user, organization, membership, role, permissions, session_id]
      properties:
        user:
          $ref: "#/components/schemas/User"
        organization:
          $ref: "#/components/schemas/Organization"
        membership:
          $ref: "#/components/schemas/Membership"
        role:
          description: Rol efectivo después de intersectar el rol local con el rol grueso de Clerk.
          allOf:
            - $ref: "#/components/schemas/Role"
        permissions:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Permission"
        session_id:
          type: string
    DeviceSession:
      type: object
      required: [id, status, created_at, last_active_at, expires_at, current]
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/SessionStatus"
        created_at:
          type: string
          format: date-time
        last_active_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        current:
          type: boolean
    Member:
      type: object
      required: [id, user, role, status, sync_status]
      properties:
        id:
          type: string
          format: uuid
        user:
          $ref: "#/components/schemas/User"
        role:
          $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/MembershipStatus"
        sync_status:
          $ref: "#/components/schemas/SyncStatus"
    DelegatedBusinessPermission:
      type: string
      enum: [accounting:manage, fiscal:manage]
    MemberBusinessPermissionsInput:
      type: object
      additionalProperties: false
      required: [permissions]
      properties:
        permissions:
          type: array
          uniqueItems: true
          maxItems: 2
          items:
            $ref: "#/components/schemas/DelegatedBusinessPermission"
    MemberBusinessPermissions:
      type: object
      additionalProperties: false
      required: [member_id, permissions]
      properties:
        member_id:
          type: string
          format: uuid
        permissions:
          type: array
          uniqueItems: true
          maxItems: 2
          items:
            $ref: "#/components/schemas/DelegatedBusinessPermission"
    Invitation:
      type: object
      required: [id, email, role, status, expires_at, sync_status]
