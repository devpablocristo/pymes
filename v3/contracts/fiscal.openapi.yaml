openapi: 3.1.0
info:
  title: Pymes Fiscal ARCA Internal API
  version: 0.2.0
  description: >-
    Contrato privado para autorización y consulta. Pymes proporciona la
    numeración; el servicio fiscal no crea comprobantes comerciales. La
    autoridad activa se selecciona por configuración entre un mock contractual
    y ARCA real multi-tenant.
servers:
  - url: https://fiscal.internal
security:
  - internalBearer: []
paths:
  /healthz:
    get:
      security: []
      operationId: fiscalHealth
      responses:
        '200':
          description: Process healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
  /readyz:
    get:
      security: []
      operationId: fiscalReadiness
      responses:
        '200':
          description: PostgreSQL ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessStatus' }
        '503':
          description: PostgreSQL no está listo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotReadyStatus' }
  /metrics:
    get:
      security: []
      operationId: fiscalMetrics
      responses:
        '200':
          description: Métricas Prometheus sin PII.
          content:
            text/plain:
              schema: { type: string }
        '503':
          description: El ledger fiscal no pudo producir métricas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsUnavailable' }
  /internal/v1/organizations/{organizationId}/authorizations:
    post:
      operationId: requestAuthorization
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FiscalRequest' }
      responses:
        '201': { description: Resultado definitivo, content: { application/json: { schema: { $ref: '#/components/schemas/FiscalResult' } } } }
        '202': { description: Resultado incierto, debe consultarse con el mismo número, content: { application/json: { schema: { $ref: '#/components/schemas/FiscalResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/AuthorityUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /internal/v1/organizations/{organizationId}/authorizations/{requestId}/consult:
    post:
      operationId: consultAuthorization
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: requestId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: false
        description: >-
          Snapshot original opcional. Si se omite, el adaptador durable lo
          recupera por organización y requestId.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FiscalRequest' }
      responses:
        '200': { description: Estado consultado en la autoridad fiscal, incluido not_found, content: { application/json: { schema: { $ref: '#/components/schemas/FiscalResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/AuthorityUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /internal/v1/organizations/{organizationId}/credentials/csr:
    post:
      operationId: requestFiscalCredentialCSR
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CSRRequest' }
      responses:
        '201':
          description: Clave generada y cifrada; sólo se devuelve el CSR.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CSRResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DomainError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /internal/v1/organizations/{organizationId}/credentials/{credentialId}:
    get:
      operationId: getFiscalCredential
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/CredentialId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Metadatos sin material criptográfico.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FiscalCredential' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/DomainError' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      operationId: uploadFiscalCertificate
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/CredentialId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CertificateUpload' }
      responses:
        '200':
          description: Certificado validado y cifrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FiscalCredential' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/DomainError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /internal/v1/organizations/{organizationId}/credentials/{credentialId}/points-of-sale/{pointOfSale}:
    put:
      operationId: configureFiscalPointOfSale
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/CredentialId'
        - name: pointOfSale
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 99999 }
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: Punto de venta configurado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FiscalPointOfSale' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/DomainError' }
        '500': { $ref: '#/components/responses/InternalError' }
  /internal/v1/organizations/{organizationId}/credentials/{credentialId}/points-of-sale/{pointOfSale}/validate:
    post:
      operationId: validateFiscalPointOfSale
      description: >-
        Valida WSAA y acceso WSFE para el punto de venta sin emitir un
        comprobante. Para el MVP exige además que el último comprobante
        autorizado sea cero para cada tipo A/B/C, NC y ND soportado; sólo un
        punto de venta dedicado y vacío puede habilitarse.
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/CredentialId'
        - name: pointOfSale
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 99999 }
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled:
                  type: boolean
                  description: Habilita el punto sólo después de validar.
      responses:
        '200':
          description: WSAA/WSFE y punto de venta validados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FiscalPointOfSale' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/AuthorityUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }
  /internal/v1/catalogs/document-types:
    get:
      operationId: listDocumentTypes
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Catálogo fiscal implementado por el adaptador.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [code, letter, kind]
                  properties:
                    code: { type: string, enum: [FA, NDA, NCA, FB, NDB, NCB, FC, NDC, NCC] }
                    letter: { type: string, enum: [A, B, C] }
                    kind: { type: string, enum: [invoice, credit_note, debit_note] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/DomainError' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    internalBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT Ed25519 de servicio de hasta cinco minutos. El header JOSE exige
        alg=EdDSA y kid presente en el JWKS activo; iss, aud=fiscal, org_id,
        iat, exp, jti, request_id, correlation_id y rol service son
        obligatorios. X-Correlation-ID debe coincidir byte a byte con el claim.
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { type: string, pattern: '^org_[A-Za-z0-9_-]+$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      description: Identificador estable propagado de extremo a extremo.
      schema: { type: string, minLength: 1, maxLength: 255 }
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema: { type: string, pattern: '^fcred_[A-Za-z0-9_-]{8,80}$' }
  responses:
    Unauthorized:
      description: Credencial interna ausente, inválida o destinada a otra organización.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Solicitud duplicada con contenido distinto.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Credencial fiscal inexistente dentro de la organización.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } }
    DomainError:
      description: Rechazo ARCA o precondición fiscal incumplida.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } }
    AuthorityUnavailable:
      description: Timeout antes de que la autoridad procese la solicitud.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } }
    InternalError:
      description: Fallo interno no atribuible a la solicitud.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: ok }
    ReadinessStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: ready }
    NotReadyStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: not_ready }
    MetricsUnavailable:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, const: METRICS_UNAVAILABLE }
    Decimal:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
      description: Decimal base diez exacto, sin signo, exponente ni JSON number.
    PositiveDecimal:
      type: string
      pattern: '^(0\.[0-9]*[1-9][0-9]*|[1-9][0-9]*(\.[0-9]+)?)$'
      description: Decimal base diez exacto estrictamente mayor que cero.
    VatRate:
      type: string
      pattern: '^(0(\.0+)?|2\.5(0+)?|5(\.0+)?|10\.5(0+)?|21(\.0+)?|27(\.0+)?)$'
      description: Alícuota IVA soportada por el mock (0; 2,5; 5; 10,5; 21 o 27).
    InternalCredential:
      type: object
      description: >-
        Identidad verificada del JWT de servicio; el token no se envía en JSON.
        kid proviene del header JOSE protegido y selecciona una clave del JWKS.
      required: [iss, aud, sub, org_id, roles, request_id, correlation_id, jti, iat, exp, kid]
      properties:
        iss: { type: string, const: pymes-v3 }
        aud: { type: string, const: fiscal }
        sub: { type: string, pattern: '^[A-Za-z0-9:_./-]{1,255}$', example: 'worker:fiscal' }
        org_id: { type: string, pattern: '^[A-Za-z0-9:_./-]{1,255}$' }
        actor_id:
          type: string
          pattern: '^[A-Za-z0-9:_./-]{1,255}$'
          description: Referencia opaca opcional del actor original; nunca PII.
        delegated_actor_id:
          type: string
          pattern: '^[A-Za-z0-9:_./-]{1,255}$'
          description: Referencia opaca opcional del actor delegado; requiere actor_id.
        roles: { type: array, items: { type: string } }
        request_id: { type: string, pattern: '^[A-Za-z0-9:_./-]{1,255}$' }
        correlation_id: { type: string, pattern: '^[A-Za-z0-9:_./-]{1,255}$' }
        jti: { type: string, pattern: '^[A-Za-z0-9:_./-]{1,255}$' }
        iat: { type: integer }
        exp: { type: integer }
        kid: { type: string, description: Identificador del header JOSE protegido. }
    CSRRequest:
      type: object
      additionalProperties: false
      required: [cuit, environment, legal_name, common_name]
      properties:
        cuit: { type: string, pattern: '^[0-9]{11}$' }
        environment: { type: string, enum: [homologation, production] }
        legal_name: { type: string, minLength: 1, maxLength: 120 }
        common_name: { type: string, minLength: 1, maxLength: 120 }
    CSRResult:
      type: object
      additionalProperties: false
      required: [credential, csr_pem]
      properties:
        credential: { $ref: '#/components/schemas/FiscalCredential' }
        csr_pem:
          type: string
          description: CSR PEM público. La clave privada nunca sale de Fiscal.
    CertificateUpload:
      type: object
      additionalProperties: false
      required: [certificate_pem, expected_version]
      properties:
        certificate_pem: { type: string, minLength: 1, maxLength: 32768 }
        expected_version: { type: integer, minimum: 1 }
    FiscalCredential:
      type: object
      additionalProperties: false
      required:
        [id, organization_id, cuit, environment, legal_name, common_name, status,
         version, created_at, updated_at]
      properties:
        id: { type: string, pattern: '^fcred_[A-Za-z0-9_-]{8,80}$' }
        organization_id: { type: string }
        cuit: { type: string, pattern: '^[0-9]{11}$' }
        environment: { type: string, enum: [homologation, production] }
        legal_name: { type: string }
        common_name: { type: string }
        status:
          type: string
          enum: [pending_certificate, ready, disabled, expired]
        certificate_fingerprint: { type: string, pattern: '^[a-f0-9]{64}$' }
        certificate_valid_from: { type: string, format: date-time }
        certificate_expires_at: { type: string, format: date-time }
        certificate_serial_number: { type: string }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FiscalPointOfSale:
      type: object
      additionalProperties: false
      required: [organization_id, credential_id, environment, number, enabled]
      properties:
        organization_id: { type: string }
        credential_id: { type: string }
        environment: { type: string, enum: [homologation, production] }
        number: { type: integer, minimum: 1, maximum: 99999 }
        enabled: { type: boolean }
        validated_at: { type: string, format: date-time }
    FiscalRequest:
      type: object
      description: >-
        idempotency_key y correlation_id deben coincidir con sus headers.
        source_version identifica la versión del documento Pymes y
        snapshot_digest su hash SHA-256 inmutable.
      required:
        - request_id
        - organization_id
        - idempotency_key
        - correlation_id
        - source_version
        - credential_ref
        - environment
        - point_of_sale
        - document_type
        - voucher_number
        - issue_date
        - concept
        - currency
        - totals
        - recipient
        - lines
        - snapshot_digest
      properties:
        request_id: { type: string }
        organization_id: { type: string }
        idempotency_key: { type: string, minLength: 8, maxLength: 128 }
        correlation_id: { type: string, minLength: 1, maxLength: 255 }
        source_version: { type: integer, minimum: 1 }
        credential_ref: { type: string, description: Referencia KMS/secret; jamás certificado o clave. }
        environment: { type: string, enum: [homologation, production] }
        point_of_sale: { type: integer, minimum: 1 }
        document_type: { type: string, enum: [FA, NDA, NCA, FB, NDB, NCB, FC, NDC, NCC] }
        voucher_number: { type: integer, minimum: 1, description: Reservado por Pymes. }
        issue_date: { type: string, format: date }
        concept:
          type: string
          enum: [products, services, products_and_services]
        service_period:
          type: object
          additionalProperties: false
          required: [from, to, payment_due]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
            payment_due: { type: string, format: date }
        currency: { type: string, enum: [ARS, USD, EUR] }
        exchange_rate:
          allOf:
            - { $ref: '#/components/schemas/PositiveDecimal' }
          description: Obligatorio para USD y EUR.
        totals:
          type: object
          required: [net, vat, exempt, total]
          properties:
            net: { $ref: '#/components/schemas/Decimal' }
            vat: { $ref: '#/components/schemas/Decimal' }
            exempt: { $ref: '#/components/schemas/Decimal' }
            total: { $ref: '#/components/schemas/Decimal' }
        recipient:
          type: object
          required: [document_type, document_number, vat_condition]
          properties:
            document_type: { type: string }
            document_number: { type: string }
            vat_condition: { type: string }
        associated_voucher:
          type: object
          required: [point_of_sale, document_type, voucher_number, issue_date]
          properties:
            point_of_sale: { type: integer, minimum: 1 }
            document_type: { type: string, enum: [FA, FB, FC] }
            voucher_number: { type: integer, minimum: 1 }
            issue_date: { type: string, format: date }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [description, quantity, unit_price, vat_rate, net]
            properties:
              description: { type: string }
              quantity: { $ref: '#/components/schemas/PositiveDecimal' }
              unit_price: { $ref: '#/components/schemas/Decimal' }
              vat_rate: { $ref: '#/components/schemas/VatRate' }
              net: { $ref: '#/components/schemas/Decimal' }
        snapshot_digest:
          type: string
          pattern: '^[A-Fa-f0-9]{64}$'
          description: Hash SHA-256 hexadecimal del documento congelado.
      allOf:
        - if:
            required: [concept]
            properties:
              concept: { enum: [services, products_and_services] }
          then:
            required: [service_period]
        - if:
            required: [currency]
            properties:
              currency: { not: { const: ARS } }
          then:
            required: [exchange_rate]
        - if:
            required: [document_type]
            properties:
              document_type: { pattern: '^(NC|ND)' }
          then:
            required: [associated_voucher]
    FiscalResult:
      type: object
      required: [request_id, organization_id, idempotency_key, correlation_id, source_version, snapshot_digest, status, observed_at]
      properties:
        request_id: { type: string }
        organization_id: { type: string }
        idempotency_key: { type: string, minLength: 8, maxLength: 128 }
        correlation_id: { type: string, minLength: 1, maxLength: 255 }
        source_version: { type: integer, minimum: 1 }
        status: { type: string, enum: [authorized, rejected, uncertain, not_found] }
        cae: { type: string }
        cae_expires_on: { type: string, format: date }
        authority_result_code: { type: string }
        authority_messages: { type: array, items: { type: string } }
        artifact_ref: { type: string, description: Referencia privada al XML cifrado, no XML. }
        snapshot_digest:
          type: string
          pattern: '^[A-Fa-f0-9]{64}$'
        observed_at: { type: string, format: date-time }
    Error:
      type: object
      required: [code, title, correlation_id]
      properties:
        code:
          type: string
          enum:
            [UNAUTHORIZED_SERVICE, IDEMPOTENCY_KEY_REUSED, AUTHORITY_TIMEOUT,
             VALIDATION_ERROR, CREDENTIAL_NOT_FOUND, CREDENTIAL_NOT_READY,
             CREDENTIAL_VERSION_CONFLICT, CERTIFICATE_INVALID,
             CERTIFICATE_CUIT_MISMATCH, CERTIFICATE_KEY_MISMATCH,
             CERTIFICATE_ENVIRONMENT_MISMATCH, CERTIFICATE_EXPIRED,
             HOMOLOGATION_REQUIRED, POINT_OF_SALE_NOT_ENABLED,
             POINT_OF_SALE_NOT_VALIDATED, POINT_OF_SALE_NOT_EMPTY,
             INTERNAL_ERROR]
        title: { type: string }
        detail: { type: string }
        correlation_id: { type: string }
