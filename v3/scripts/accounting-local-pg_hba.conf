# Local Docker development only. The service port is bound to 127.0.0.1 and
# login roles remain NOINHERIT/NOSUPERUSER/NOCREATEDB/NOCREATEROLE/NOBYPASSRLS.
# Cloud deployments never mount this file and authenticate with Secret Manager.
local all all trust
host all all 127.0.0.1/32 trust
host all all ::1/128 trust
host all all all trust
