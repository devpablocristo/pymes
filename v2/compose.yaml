name: pymes-v2

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pymes
      POSTGRES_PASSWORD: pymes
      POSTGRES_DB: pymes_v2
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - pymes_v2_postgres_data:/var/lib/postgresql/data
      - ./db/dev/init-test-database.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pymes -d pymes_v2"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  migrate:
    build:
      context: ./db
    environment:
      PYMES_DATABASE_URL: postgres://pymes:pymes@postgres:5432/pymes_v2?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    environment:
      PYMES_HTTP_ADDR: :8080
      PYMES_DATABASE_URL: postgres://pymes:pymes@postgres:5432/pymes_v2?sslmode=disable
      PYMES_SHUTDOWN_TIMEOUT: 10s
      PYMES_READINESS_TIMEOUT: 2s
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    init: true
    stop_grace_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ./web
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15
    init: true
    restart: unless-stopped

volumes:
  pymes_v2_postgres_data:
