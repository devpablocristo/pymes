root = "."
tmp_dir = "tmp/fiscal-accounting-worker"

[build]
  bin = "./tmp/fiscal-accounting-worker/pymes-v2-fiscal-accounting-worker"
  cmd = "GOWORK=off go build -o ./tmp/fiscal-accounting-worker/pymes-v2-fiscal-accounting-worker ./cmd/fiscal-accounting-worker"
  delay = 750
  exclude_dir = ["tmp", "vendor", "node_modules"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "sql"]
  kill_delay = "500ms"
  send_interrupt = true
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
