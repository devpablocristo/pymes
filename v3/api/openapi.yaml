openapi: 3.1.0
info:
  title: Pymes API
  version: 1.0.0-draft
  description: API pública de Pymes v3. Los importes se representan como strings decimales.
security:
  - clerkBearer: []
  - clerkSessionCookie: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      security: []
      responses:
        '200': { description: Healthy }
  /readyz:
    get:
      operationId: getReadyz
      security: []
      responses:
        '200': { description: Ready }
        '503':
          description: PostgreSQL o una dependencia obligatoria no está lista.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: not_ready }
  /api/v1/session:
    get:
      operationId: getCurrentSession
      summary: Resuelve la sesión Clerk activa a la identidad local de Pymes.
      description: >-
        El BFF valida el JWT de Clerk y proyecta la organización externa sobre
        el identificador tenant local. Los clientes nunca deben usar el
        identificador de organización de Clerk para construir rutas tenant.
      responses:
        '200':
          description: Sesión autenticada y membresía local activa.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentSession' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/v1/webhooks/clerk:
    post:
      operationId: clerkWebhook
      summary: Recibe eventos Clerk firmados para sincronizar identidad y organizaciones.
      description: >-
        Endpoint público exclusivamente para Clerk. La firma Svix se verifica
        sobre el cuerpo crudo antes de persistir el evento en el inbox IAM. Esta
        operación queda excluida del servidor comercial generado y se monta con
        su handler especializado.
      security: []
      parameters:
        - name: svix-id
          in: header
          required: true
          description: Identificador único del mensaje firmado por Clerk/Svix.
          schema: { type: string, minLength: 1 }
        - name: svix-timestamp
          in: header
          required: true
          description: Timestamp incluido en la firma Clerk/Svix.
          schema: { type: string, minLength: 1 }
        - name: svix-signature
          in: header
          required: true
          description: Firma Clerk/Svix verificada sobre el cuerpo HTTP crudo.
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '204': { description: Evento verificado y aceptado, headers: { Cache-Control: { schema: { type: string, const: no-store } } } }
        '400':
          description: Cuerpo ausente, demasiado grande o evento inválido.
          content:
            text/plain:
              schema: { type: string, pattern: '^WEBHOOK_INVALID_PAYLOAD\n?$' }
        '401':
          description: Firma Svix inválida.
          content:
            text/plain:
              schema: { type: string, pattern: '^WEBHOOK_INVALID_SIGNATURE\n?$' }
        '503':
          description: Verificador no configurado o inbox IAM no disponible.
          content:
            text/plain:
              schema: { type: string, pattern: '^(AUTH_NOT_CONFIGURED|IAM_UNAVAILABLE)\n?$' }
  /api/v1/webhooks/pergo:
    post:
      operationId: pergoWebhook
      summary: Recibe estados de entrega firmados por PerGo.
      description: >-
        Endpoint exclusivo para PerGo. Verifica X-PerGo-Signature sobre el
        cuerpo crudo, una ventana temporal máxima de cinco minutos, el workspace
        configurado y el trace_id determinístico tenant-aware de Pymes. La
        organización nunca se acepta desde el path. El inbox hace que reintentos
        del mismo webhook sean idempotentes.
      security: []
      parameters:
        - name: X-PerGo-Signature
          in: header
          required: true
          schema:
            type: string
            pattern: '^t=[0-9]+,v1=[0-9a-f]{64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PerGoDeliveryEvent' }
      responses:
        '204': { description: Estado autenticado, aplicado o ya procesado. }
        '400':
          description: Evento inválido o no aplicable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Firma inválida, ausente o vencida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: La intención no existe dentro de la organización.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Integración no configurada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/organizations/{organizationId}/notifications/{notificationId}:
    get:
      operationId: getNotification
      summary: Consulta el estado comercial de una notificación.
      description: >-
        Nunca expone teléfono, cuerpo, variables ni credenciales del proveedor.
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - name: notificationId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
      responses:
        '200':
          description: Proyección de entrega.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/v1/organizations/{organizationId}/calendars/google/oauth/start:
    post:
      operationId: startGoogleCalendarOAuth
      summary: Inicia una conexión OAuth de Google Calendar para la organización.
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleCalendarOAuthStartInput' }
      responses:
        '201':
          description: Estado OAuth durable, de propósito único y ligado a la sesión Clerk.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoogleCalendarOAuthStart' }
        '400': { $ref: '#/components/responses/InvalidCommand' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/v1/calendars/google/oauth/callback:
    get:
      operationId: completeGoogleCalendarOAuth
      summary: Completa OAuth directamente en el BFF sin entregar el código a la web.
      description: >-
        Google redirige a esta ruta global. El BFF vuelve a autenticar la misma
        sesión Clerk y consume el state una sola vez, ligado a tenant, actor,
        sesión y vencimiento.
      parameters:
        - name: state
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 1024 }
        - name: code
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 4096 }
        - name: error
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 255 }
      responses:
        '200':
          description: Conexión creada o reconciliada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarConnection' }
        '400': { $ref: '#/components/responses/InvalidCommand' }
        '401':
          description: La conexión requiere una nueva autorización.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: El estado OAuth venció.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/DomainError' }
        '503':
          description: Google Calendar o IAM no está disponible.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/organizations/{organizationId}/calendars/connections:
    get:
      operationId: listCalendarConnections
      summary: Lista conexiones Calendar sin exponer grants ni tokens.
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
      responses:
        '200':
          description: Conexiones visibles dentro de la organización.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CalendarConnection' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/v1/organizations/{organizationId}/calendars/connections/{connectionId}:
    delete:
      operationId: disconnectCalendarConnection
      summary: Revoca y desconecta una conexión Calendar de la organización.
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - name: connectionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Conexión revocada o desconexión ya convergida. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: Google Calendar o IAM no está disponible.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/organizations/{organizationId}/sales:
    post:
      operationId: createSale
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/SourceVersion' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SaleInput' } } }
      responses:
        '201': { description: Sale accepted for fiscal processing, content: { application/json: { schema: { $ref: '#/components/schemas/Sale' } } } }
        '400': { $ref: '#/components/responses/InvalidCommand' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/v1/organizations/{organizationId}/parties:
    post:
      operationId: createParty
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/SourceVersion' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PartyInput' } } }
      responses:
        '201': { description: Party created, content: { application/json: { schema: { $ref: '#/components/schemas/Party' } } } }
        '400': { $ref: '#/components/responses/InvalidCommand' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/v1/organizations/{organizationId}/parties/{partyId}:
    get:
      operationId: getParty
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { name: partyId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Party, content: { application/json: { schema: { $ref: '#/components/schemas/Party' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/v1/organizations/{organizationId}/purchases:
    post:
      operationId: createPurchase
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/SourceVersion' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PurchaseInput' } } }
      responses:
        '201': { description: Purchase accepted for accounting, content: { application/json: { schema: { $ref: '#/components/schemas/Purchase' } } } }
        '400': { $ref: '#/components/responses/InvalidCommand' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/v1/organizations/{organizationId}/purchases/{purchaseId}:
    get:
      operationId: getPurchase
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { name: purchaseId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Purchase, content: { application/json: { schema: { $ref: '#/components/schemas/Purchase' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/v1/organizations/{organizationId}/payments:
    post:
      operationId: createPayment
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/SourceVersion' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PaymentInput' } } }
      responses:
        '201': { description: Payment and applications accepted for accounting, content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } } }
        '400': { $ref: '#/components/responses/InvalidCommand' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/v1/organizations/{organizationId}/payments/{paymentId}:
    get:
      operationId: getPayment
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { name: paymentId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Payment, content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/v1/organizations/{organizationId}/reversals:
    post:
      operationId: createAccountingReversal
      description: Revierte compras o pagos. Las ventas fiscales se corrigen creando NC/ND asociadas.
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/SourceVersion' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReversalInput' } } }
      responses:
        '201': { description: Reversal accepted for accounting, content: { application/json: { schema: { $ref: '#/components/schemas/Reversal' } } } }
        '400': { $ref: '#/components/responses/InvalidCommand' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/v1/organizations/{organizationId}/accounting-failures/{failureId}:
    get:
      operationId: getAccountingFailure
      summary: Consulta un PERIOD_LOCKED recuperable de la organización.
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - name: failureId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Fallo contable y estado de recuperación, sin exponer el comando privado.
          content: { application/json: { schema: { $ref: '#/components/schemas/AccountingFailure' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/v1/organizations/{organizationId}/accounting-failures/{failureId}/adjustments:
    post:
      operationId: createAccountingAdjustment
      summary: Solicita explícitamente contabilizar en un período abierto autorizado.
      description: >-
        Sólo owner/admin. No cambia el documento fuente ni un asiento existente:
        crea un nuevo comando contable idempotente que conserva el snapshot
        original y reemplaza únicamente la fecha efectiva.
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - name: failureId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/SourceVersion' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountingAdjustmentInput' }
      responses:
        '201':
          description: Ajuste aceptado y escrito en el outbox transaccional.
          content: { application/json: { schema: { $ref: '#/components/schemas/AccountingAdjustment' } } }
        '400': { $ref: '#/components/responses/InvalidCommand' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/v1/organizations/{organizationId}/sales/{saleId}:
    get:
      operationId: getSale
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }, { name: saleId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Sale, content: { application/json: { schema: { $ref: '#/components/schemas/Sale' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
  /api/v1/organizations/{organizationId}/scheduling/branches:
    $ref: './scheduling.openapi.yaml#/paths/~1api~1v1~1organizations~1{organizationId}~1scheduling~1branches'
  /api/v1/organizations/{organizationId}/scheduling/services:
    $ref: './scheduling.openapi.yaml#/paths/~1api~1v1~1organizations~1{organizationId}~1scheduling~1services'
  /api/v1/organizations/{organizationId}/scheduling/resources:
    $ref: './scheduling.openapi.yaml#/paths/~1api~1v1~1organizations~1{organizationId}~1scheduling~1resources'
  /api/v1/organizations/{organizationId}/scheduling/availability:
    $ref: './scheduling.openapi.yaml#/paths/~1api~1v1~1organizations~1{organizationId}~1scheduling~1availability'
  /api/v1/organizations/{organizationId}/scheduling/availability/rules:
    $ref: './scheduling.openapi.yaml#/paths/~1api~1v1~1organizations~1{organizationId}~1scheduling~1availability~1rules'
  /api/v1/organizations/{organizationId}/scheduling/blocks:
    $ref: './scheduling.openapi.yaml#/paths/~1api~1v1~1organizations~1{organizationId}~1scheduling~1blocks'
  /api/v1/organizations/{organizationId}/scheduling/sessions:
    $ref: './scheduling.openapi.yaml#/paths/~1api~1v1~1organizations~1{organizationId}~1scheduling~1sessions'
  /api/v1/organizations/{organizationId}/scheduling/bookings:
    $ref: './scheduling.openapi.yaml#/paths/~1api~1v1~1organizations~1{organizationId}~1scheduling~1bookings'
  /api/v1/organizations/{organizationId}/scheduling/bookings/{bookingId}:
    $ref: './scheduling.openapi.yaml#/paths/~1api~1v1~1organizations~1{organizationId}~1scheduling~1bookings~1{bookingId}'
  /api/v1/organizations/{organizationId}/scheduling/bookings/{bookingId}/reschedule:
    $ref: './scheduling.openapi.yaml#/paths/~1api~1v1~1organizations~1{organizationId}~1scheduling~1bookings~1{bookingId}~1reschedule'
  /api/v1/organizations/{organizationId}/scheduling/bookings/{bookingId}/{action}:
    $ref: './scheduling.openapi.yaml#/paths/~1api~1v1~1organizations~1{organizationId}~1scheduling~1bookings~1{bookingId}~1{action}'
  /api/v1/organizations/{organizationId}/scheduling/waitlist:
    $ref: './scheduling.openapi.yaml#/paths/~1api~1v1~1organizations~1{organizationId}~1scheduling~1waitlist'
  /api/v1/organizations/{organizationId}/scheduling/queue:
    $ref: './scheduling.openapi.yaml#/paths/~1api~1v1~1organizations~1{organizationId}~1scheduling~1queue'
  /api/v1/organizations/{organizationId}/scheduling/queue/{ticketId}:
    $ref: './scheduling.openapi.yaml#/paths/~1api~1v1~1organizations~1{organizationId}~1scheduling~1queue~1{ticketId}'
  /api/v1/public/scheduling/{organizationSlug}/availability:
    $ref: './scheduling.openapi.yaml#/paths/~1api~1v1~1public~1scheduling~1{organizationSlug}~1availability'
  /api/v1/public/scheduling/{organizationSlug}/catalog:
    $ref: './scheduling.openapi.yaml#/paths/~1api~1v1~1public~1scheduling~1{organizationSlug}~1catalog'
  /api/v1/public/scheduling/{organizationSlug}/bookings:
    $ref: './scheduling.openapi.yaml#/paths/~1api~1v1~1public~1scheduling~1{organizationSlug}~1bookings'
  /api/v1/public/scheduling/{organizationSlug}/waitlist:
    $ref: './scheduling.openapi.yaml#/paths/~1api~1v1~1public~1scheduling~1{organizationSlug}~1waitlist'
  /api/v1/public/scheduling/actions/{token}:
    $ref: './scheduling.openapi.yaml#/paths/~1api~1v1~1public~1scheduling~1actions~1{token}'
  /api/v1/organizations/{organizationId}/fiscal/credentials/csr:
    post:
      operationId: requestFiscalCredentialCSR
      summary: Genera dentro de Fiscal la clave privada tenant y devuelve sólo el CSR público.
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FiscalCredentialCSRInput' }
      responses:
        '201':
          description: Clave generada y cifrada; la clave privada nunca atraviesa el BFF.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FiscalCredentialCSRResult' }
        '400': { $ref: '#/components/responses/InvalidCommand' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/FiscalUnavailable' }
  /api/v1/organizations/{organizationId}/fiscal/credentials/{credentialId}:
    get:
      operationId: getFiscalCredential
      summary: Consulta metadatos fiscales sin devolver material criptográfico.
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { $ref: '#/components/parameters/FiscalCredentialId' }
      responses:
        '200':
          description: Metadatos de la credencial tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FiscalCredential' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/FiscalUnavailable' }
    put:
      operationId: uploadFiscalCertificate
      summary: Entrega a Fiscal el certificado emitido por ARCA para la clave tenant.
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { $ref: '#/components/parameters/FiscalCredentialId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FiscalCertificateUpload' }
      responses:
        '200':
          description: Certificado validado y cifrado dentro de Fiscal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FiscalCredential' }
        '400': { $ref: '#/components/responses/InvalidCommand' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
        '422': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/FiscalUnavailable' }
  /api/v1/organizations/{organizationId}/fiscal/credentials/{credentialId}/points-of-sale/{pointOfSale}:
    put:
      operationId: configureFiscalPointOfSale
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { $ref: '#/components/parameters/FiscalCredentialId' }
        - { $ref: '#/components/parameters/FiscalPointOfSaleNumber' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FiscalPointOfSaleConfiguration' }
      responses:
        '200':
          description: Punto de venta configurado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FiscalPointOfSale' }
        '400': { $ref: '#/components/responses/InvalidCommand' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/FiscalUnavailable' }
  /api/v1/organizations/{organizationId}/fiscal/credentials/{credentialId}/points-of-sale/{pointOfSale}/validate:
    post:
      operationId: validateFiscalPointOfSale
      description: Valida WSAA/WSFE sin emitir un comprobante y opcionalmente habilita el punto.
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { $ref: '#/components/parameters/FiscalCredentialId' }
        - { $ref: '#/components/parameters/FiscalPointOfSaleNumber' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FiscalPointOfSaleConfiguration' }
      responses:
        '200':
          description: Credencial y punto de venta validados contra ARCA.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FiscalPointOfSale' }
        '400': { $ref: '#/components/responses/InvalidCommand' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/FiscalUnavailable' }
  /api/v1/organizations/{organizationId}/features:
    get:
      operationId: getOrganizationFeatures
      summary: Consulta los rollouts habilitados para la organización autenticada.
      description: >-
        Devuelve únicamente configuración de producto. No expone credenciales,
        secretos ni configuración interna de los proveedores.
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
      responses:
        '200':
          description: Configuración tenant y versión optimista.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationFeatureFlags' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
    put:
      operationId: updateOrganizationFeatures
      summary: Reemplaza atómicamente los cuatro rollouts de una organización.
      description: >-
        Requiere owner/admin, organización ready y expected_version. Todos los
        flags tienen default seguro false y el cambio queda auditado.
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationFeatureFlagsUpdate' }
      responses:
        '200':
          description: Configuración actualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationFeatureFlags' }
        '400': { $ref: '#/components/responses/InvalidCommand' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: expected_version no coincide con la versión actual.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/DomainError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }
components:
  securitySchemes:
    clerkBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de sesión Clerk validado por el BFF.
    clerkSessionCookie:
      type: apiKey
      in: cookie
      name: __session
      description: >-
        JWT de sesión Clerk aceptado sólo cuando navegador y BFF comparten el
        mismo origen; permite completar redirects OAuth sin exponer el código.
  parameters:
    OrganizationId: { name: organizationId, in: path, required: true, schema: { type: string } }
    FiscalCredentialId:
      name: credentialId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FiscalPointOfSaleNumber:
      name: pointOfSale
      in: path
      required: true
      schema: { type: integer, minimum: 1, maximum: 99999 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Clave pública estable. Queda vinculada a organización, operación, source ID y source version.
      schema: { type: string, minLength: 1, maxLength: 255 }
    SourceVersion:
      name: X-Source-Version
      in: header
      required: true
      description: Versión positiva del snapshot de origen incluida en la identidad idempotente.
      schema: { type: integer, minimum: 1 }
  responses:
    InvalidCommand:
      description: Comando inválido o cabeceras idempotentes ausentes.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    IdempotencyConflict:
      description: La clave o identidad del comando ya fue usada con otro payload.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: La sesión Clerk no pertenece a la organización o el rol no autoriza la operación.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    DomainError:
      description: La organización no está lista o una regla comercial impide el comando.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: El recurso no existe en la organización autenticada.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AuthUnavailable:
      description: Clerk/IAM no está configurado en el BFF.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    FiscalUnavailable:
      description: Fiscal o ARCA no están disponibles; no se expone detalle sensible.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    CurrentSession:
      type: object
      additionalProperties: false
      required: [actor_id, organization, role, permissions]
      properties:
        actor_id: { type: string, minLength: 1 }
        organization:
          type: object
          additionalProperties: false
          required: [id, name, slug, status]
          properties:
            id: { type: string, minLength: 1 }
            name: { type: string, minLength: 1 }
            slug: { type: string, minLength: 1 }
            status: { type: string, enum: [pending, ready, failed, suspended] }
        role: { type: string, enum: [owner, admin, member, viewer] }
        permissions:
          type: array
          items: { type: string }
    Error:
      type: object
      required: [code]
      properties:
        code:
          type: string
          enum:
            - AUTH_NOT_CONFIGURED
            - FORBIDDEN
            - ORG_NOT_PROVISIONED
            - NOT_FOUND
            - IDEMPOTENCY_KEY_REQUIRED
            - SOURCE_VERSION_REQUIRED
            - IDEMPOTENCY_KEY_REUSED
            - DOCUMENT_NOT_REVERSIBLE
            - INVALID_APPLICATION_DOCUMENT
            - INVALID_SOURCE_DOCUMENT
            - OPEN_ITEM_AMOUNT_EXCEEDED
            - PERIOD_LOCKED
            - ACCOUNTING_ADJUSTMENT_NOT_ALLOWED
            - CREDENTIAL_NOT_FOUND
            - CREDENTIAL_NOT_READY
            - CREDENTIAL_VERSION_CONFLICT
            - CERTIFICATE_INVALID
            - CERTIFICATE_CUIT_MISMATCH
            - CERTIFICATE_ENVIRONMENT_MISMATCH
            - POINT_OF_SALE_NOT_VALIDATED
            - AUTHORITY_TIMEOUT
            - FISCAL_UNAVAILABLE
            - VALIDATION_ERROR
            - COMMAND_REJECTED
            - NOTIFICATIONS_UNAVAILABLE
            - PERGO_WEBHOOK_NOT_CONFIGURED
            - PERGO_WEBHOOK_SIGNATURE_INVALID
            - PERGO_WEBHOOK_INVALID
            - NOTIFICATION_NOT_FOUND
            - OAUTH_PROVIDER_DENIED
            - OAUTH_STATE_INVALID
            - OAUTH_STATE_EXPIRED
            - FEATURE_DISABLED
            - FEATURE_VERSION_CONFLICT
            - CALENDAR_REAUTH_REQUIRED
            - CALENDAR_PROVIDER_UNAVAILABLE
            - INTERNAL_ERROR
    OrganizationFeatureFlagsUpdate:
      type: object
      additionalProperties: false
      required:
        - scheduling_enabled
        - whatsapp_enabled
        - google_calendar_enabled
        - fiscal_real_enabled
        - expected_version
      properties:
        scheduling_enabled: { type: boolean, default: false }
        whatsapp_enabled: { type: boolean, default: false }
        google_calendar_enabled: { type: boolean, default: false }
        fiscal_real_enabled: { type: boolean, default: false }
        expected_version: { type: integer, format: int64, minimum: 1 }
    OrganizationFeatureFlags:
      type: object
      additionalProperties: false
      required:
        - organization_id
        - scheduling_enabled
        - whatsapp_enabled
        - google_calendar_enabled
        - fiscal_real_enabled
        - version
        - updated_at
        - updated_by
      properties:
        organization_id: { type: string, readOnly: true }
        scheduling_enabled: { type: boolean }
        whatsapp_enabled: { type: boolean }
        google_calendar_enabled: { type: boolean }
        fiscal_real_enabled: { type: boolean }
        version: { type: integer, format: int64, minimum: 1, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
        updated_by: { type: string, readOnly: true }
    GoogleCalendarOAuthStartInput:
      type: object
      additionalProperties: false
      required: [time_zone, free_busy_enabled, meet_enabled]
      properties:
        time_zone:
          type: string
          minLength: 1
          maxLength: 255
          description: Zona IANA usada por el calendario secundario.
        free_busy_enabled: { type: boolean }
        meet_enabled: { type: boolean }
    GoogleCalendarOAuthStart:
      type: object
      additionalProperties: false
      required: [connection_id, authorization_url, expires_at]
      properties:
        connection_id: { type: string, format: uuid }
        authorization_url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }
    CalendarConnection:
      type: object
      additionalProperties: false
      required:
        - id
        - provider
        - status
        - calendar_connected
        - time_zone
        - free_busy_enabled
        - meet_enabled
        - version
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, const: google }
        status:
          type: string
          enum: [pending, active, reauth_required, revoked]
        calendar_connected: { type: boolean }
        time_zone: { type: string, minLength: 1, maxLength: 255 }
        free_busy_enabled: { type: boolean }
        meet_enabled: { type: boolean }
        access_token_expires_at: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
    PerGoDeliveryEvent:
      type: object
      additionalProperties: false
      required:
        - event
        - trace_id
        - message_id
        - channel
        - timestamp
        - workspace_id
      properties:
        event:
          type: string
          enum:
            - message.queued
            - message.sent
            - message.delivered
            - message.read
            - message.failed
        trace_id:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^pymes\.v1\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
        message_id: { type: string, minLength: 1, maxLength: 255 }
        channel:
          type: string
          enum: [whatsapp, whatsapp_cloud, whatsapp_mock]
        timestamp: { type: string, format: date-time }
        workspace_id: { type: string, minLength: 1, maxLength: 255 }
        error:
          type: string
          description: No se persiste ni se expone; Pymes conserva sólo un código estable.
    Notification:
      type: object
      additionalProperties: false
      required:
        - id
        - organization_id
        - kind
        - aggregate_type
        - aggregate_id
        - template_name
        - template_version
        - locale
        - send_at
        - status
        - correlation_id
        - created_at
        - updated_at
      properties:
        id: { type: string }
        organization_id: { type: string }
        kind:
          type: string
          enum: [confirmation, reminder, rescheduled, cancellation, waitlist]
        aggregate_type: { type: string }
        aggregate_id: { type: string }
        template_name: { type: string }
        template_version: { type: integer, minimum: 1 }
        locale: { type: string }
        send_at: { type: string, format: date-time }
        status:
          type: string
          enum: [pending, uncertain, queued, sent, delivered, read, failed]
        external_message_id: { type: string, readOnly: true }
        correlation_id: { type: string }
        failure_code:
          type: string
          readOnly: true
          pattern: '^[A-Z0-9_]{1,80}$'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FiscalCredentialCSRInput:
      type: object
      additionalProperties: false
      required: [cuit, legal_name, common_name, environment]
      properties:
        cuit: { type: string, pattern: '^[0-9]{11}$' }
        legal_name: { type: string, minLength: 1, maxLength: 200 }
        common_name: { type: string, minLength: 1, maxLength: 200 }
        environment: { type: string, enum: [homologation, production] }
    FiscalCredential:
      type: object
      additionalProperties: false
      required:
        - id
        - organization_id
        - cuit
        - legal_name
        - common_name
        - environment
        - status
        - version
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string }
        cuit: { type: string, pattern: '^[0-9]{11}$' }
        legal_name: { type: string }
        common_name: { type: string }
        environment: { type: string, enum: [homologation, production] }
        status: { type: string, enum: [pending_certificate, ready, expired, disabled] }
        version: { type: integer, minimum: 1 }
        certificate_fingerprint: { type: string, readOnly: true }
        certificate_serial_number: { type: string, readOnly: true }
        certificate_valid_from: { type: string, format: date-time, readOnly: true }
        certificate_expires_at: { type: string, format: date-time, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    FiscalCredentialCSRResult:
      type: object
      additionalProperties: false
      required: [credential, csr_pem]
      properties:
        credential: { $ref: '#/components/schemas/FiscalCredential' }
        csr_pem:
          type: string
          readOnly: true
          description: CSR público para registrar en ARCA; nunca contiene la clave privada.
    FiscalCertificateUpload:
      type: object
      additionalProperties: false
      required: [certificate_pem, expected_version]
      properties:
        certificate_pem:
          type: string
          writeOnly: true
          minLength: 1
        expected_version: { type: integer, minimum: 1 }
    FiscalPointOfSaleConfiguration:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: { type: boolean }
    FiscalPointOfSale:
      type: object
      additionalProperties: false
      required: [organization_id, credential_id, environment, number, enabled]
      properties:
        organization_id: { type: string }
        credential_id: { type: string, format: uuid }
        environment: { type: string, enum: [homologation, production] }
        number: { type: integer, minimum: 1, maximum: 99999 }
        enabled: { type: boolean }
        validated_at: { type: string, format: date-time, readOnly: true }
    AccountingFailureRef:
      type: object
      readOnly: true
      required: [id, code]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, const: PERIOD_LOCKED }
    AccountingFailure:
      type: object
      additionalProperties: false
      required:
        - id
        - organization_id
        - source_kind
        - source_id
        - failed_effective_at
        - status
        - failure_code
        - correlation_id
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string }
        source_kind:
          type: string
          enum: [sale, purchase, payment, accounting_application, accounting_reversal]
        source_id: { type: string }
        failed_effective_at: { type: string, format: date-time }
        status:
          type: string
          enum: [awaiting_adjustment, adjustment_pending, resolved]
        failure_code: { type: string, const: PERIOD_LOCKED }
        correlation_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AccountingAdjustmentInput:
      type: object
      additionalProperties: false
      required: [id, effective_at, reason]
      properties:
        id: { type: string, minLength: 1, maxLength: 255 }
        effective_at:
          type: string
          format: date-time
          description: Fecha elegida por owner/admin dentro de un período contable abierto.
        reason: { type: string, minLength: 1, maxLength: 500 }
    AccountingAdjustment:
      allOf:
        - { $ref: '#/components/schemas/AccountingAdjustmentInput' }
        - type: object
          additionalProperties: false
          required:
            - organization_id
            - failure_id
            - status
            - correlation_id
            - created_at
            - updated_at
          properties:
            organization_id: { type: string }
            failure_id: { type: string, format: uuid }
            status: { type: string, enum: [pending, period_locked, posted] }
            correlation_id: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: '^-?[0-9]+(\\.[0-9]+)?$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    NonNegativeDecimal:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
      description: Decimal base diez exacto, sin exponente ni JSON number.
    PositiveDecimal:
      type: string
      pattern: '^([1-9][0-9]*)(\.[0-9]+)?$|^0\.(0*[1-9][0-9]*)$'
      description: Decimal base diez exacto estrictamente mayor que cero.
    VatBreakdownItem:
      type: object
      additionalProperties: false
      required: [rate, base_amount, tax_amount]
      properties:
        rate:
          type: string
          enum: ['0', '2.5', '5', '10.5', '21', '27']
          description: Alícuota IVA expresada como string exacta.
        base_amount: { $ref: '#/components/schemas/NonNegativeDecimal' }
        tax_amount: { $ref: '#/components/schemas/NonNegativeDecimal' }
    SaleInput:
      type: object
      required: [id, recipient_ref, point_of_sale, document_type, amount, currency, credential_ref, fiscal]
      properties:
        id: { type: string }
        recipient_ref: { type: string }
        point_of_sale: { type: integer, minimum: 1 }
        document_type: { type: string, enum: [FA, NDA, NCA, FB, NDB, NCB, FC, NDC, NCC] }
        amount: { type: string, pattern: '^[0-9]+(\\.[0-9]+)?$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        exchange_rate:
          $ref: '#/components/schemas/PositiveDecimal'
          description: Obligatorio para USD/EUR; cotización contra ARS con hasta seis decimales.
        credential_ref: { type: string, writeOnly: true }
        source_document_id:
          type: string
          description: Obligatorio para NC/ND; referencia al documento Pymes original.
        fiscal:
          type: object
          description: Snapshot fiscal inmutable; Pymes agrega identidad, numeración y digest antes de llamar al adaptador.
          required: [environment, issue_date, totals, recipient, lines]
          properties:
            environment: { type: string, enum: [homologation, production] }
            issue_date: { type: string, format: date }
            concept:
              type: string
              enum: [products, services, products_and_services]
              default: products
              description: Concepto WSFE; se congela como products cuando el cliente lo omite.
            service_period:
              type: object
              additionalProperties: false
              required: [from, to, payment_due]
              properties:
                from: { type: string, format: date }
                to: { type: string, format: date }
                payment_due: { type: string, format: date }
            totals: { type: object }
            recipient: { type: object }
            lines: { type: array, minItems: 1, items: { type: object } }
      allOf:
        - if:
            required: [currency]
            properties:
              currency: { not: { const: ARS } }
          then:
            required: [exchange_rate]
    Sale:
      type: object
      required: [id, organization_id, recipient_ref, voucher, fiscal_environment, total, status, snapshot_digest]
      properties:
        id: { type: string }
        organization_id: { type: string }
        recipient_ref: { type: string }
        voucher:
          type: object
          required: [point_of_sale, document_type, voucher_number]
          properties:
            point_of_sale: { type: integer, minimum: 1 }
            document_type: { type: string, enum: [FA, NDA, NCA, FB, NDB, NCB, FC, NDC, NCC] }
            voucher_number:
              type: integer
              minimum: 1
              readOnly: true
              description: Número reservado atómicamente por Pymes.
        fiscal_environment: { type: string, enum: [homologation, production] }
        total: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [fiscal_pending, fiscal_uncertain, fiscal_rejected, authorized_pending_posting, accounting_adjustment_required, accounting_adjustment_pending, posted, partially_paid, paid, reversed] }
        snapshot_digest: { type: string }
        source_document_id: { type: string }
        cae: { type: string, readOnly: true }
        journal_entry_id: { type: string, readOnly: true }
        open_item_id: { type: string, readOnly: true }
        accounting_failure: { $ref: '#/components/schemas/AccountingFailureRef' }
    PartyInput:
      type: object
      required: [id, kind, display_name]
      properties:
        id: { type: string }
        kind: { type: string, enum: [customer, supplier, both] }
        display_name: { type: string }
        tax_identifier: { type: string }
    Party:
      allOf:
        - { $ref: '#/components/schemas/PartyInput' }
        - type: object
          required: [organization_id]
          properties: { organization_id: { type: string } }
    PurchaseInput:
      type: object
      description: >-
        amount es el total del comprobante. Debe ser igual a net_amount +
        exempt_amount + la suma de vat_breakdown.tax_amount. exchange_rate es
        obligatorio y debe ser mayor que cero cuando currency no es ARS.
      required: [id, supplier_ref, external_document_ref, issue_date, amount, currency, net_amount, exempt_amount, vat_breakdown]
      properties:
        id: { type: string }
        supplier_ref: { type: string }
        external_document_ref: { type: string }
        issue_date:
          type: string
          format: date
          description: Fecha contable del comprobante; determina el período del asiento.
        amount: { $ref: '#/components/schemas/NonNegativeDecimal' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        net_amount: { $ref: '#/components/schemas/NonNegativeDecimal' }
        exempt_amount: { $ref: '#/components/schemas/NonNegativeDecimal' }
        vat_breakdown:
          type: array
          items: { $ref: '#/components/schemas/VatBreakdownItem' }
        exchange_rate: { $ref: '#/components/schemas/PositiveDecimal' }
      allOf:
        - if:
            required: [currency]
            properties:
              currency: { not: { const: ARS } }
          then:
            required: [exchange_rate]
    Purchase:
      type: object
      description: >-
        total conserva el importe y moneda originales. exchange_rate es
        obligatorio cuando total.currency no es ARS.
      required: [id, organization_id, supplier_ref, external_document_ref, issue_date, total, net_amount, exempt_amount, vat_breakdown, status, snapshot_digest]
      properties:
        id: { type: string }
        organization_id: { type: string }
        supplier_ref: { type: string }
        external_document_ref: { type: string }
        issue_date:
          type: string
          format: date
          description: Fecha contable persistida del comprobante.
        total: { $ref: '#/components/schemas/Money' }
        net_amount: { $ref: '#/components/schemas/NonNegativeDecimal' }
        exempt_amount: { $ref: '#/components/schemas/NonNegativeDecimal' }
        vat_breakdown:
          type: array
          items: { $ref: '#/components/schemas/VatBreakdownItem' }
        exchange_rate: { $ref: '#/components/schemas/PositiveDecimal' }
        status: { type: string, enum: [confirmed, accounting_adjustment_required, accounting_adjustment_pending, posted, partially_paid, paid, reversed] }
        snapshot_digest: { type: string }
        journal_entry_id: { type: string, readOnly: true }
        open_item_id: { type: string, readOnly: true }
        accounting_failure: { $ref: '#/components/schemas/AccountingFailureRef' }
      allOf:
        - if:
            required: [total]
            properties:
              total:
                required: [currency]
                properties:
                  currency: { not: { const: ARS } }
          then:
            required: [exchange_rate]
    PaymentInput:
      type: object
      required: [id, direction, party_ref, amount, currency, applications]
      properties:
        id: { type: string }
        direction: { type: string, enum: [receipt, disbursement] }
        party_ref: { type: string }
        amount: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        applications:
          type: array
          items:
            type: object
            required: [id, document_kind, document_id, amount]
            properties:
              id: { type: string }
              document_kind: { type: string, enum: [sale, purchase] }
              document_id: { type: string }
              amount: { type: string, pattern: '^[0-9]+(\.[0-9]+)?$' }
    Payment:
      type: object
      required: [id, organization_id, direction, party_ref, total, status]
      properties:
        id: { type: string }
        organization_id: { type: string }
        direction: { type: string, enum: [receipt, disbursement] }
        party_ref: { type: string }
        total: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [confirmed, accounting_adjustment_required, accounting_adjustment_pending, posted, reversed] }
        journal_entry_id: { type: string, readOnly: true }
        open_item_id: { type: string, readOnly: true }
        accounting_failure: { $ref: '#/components/schemas/AccountingFailureRef' }
    ReversalInput:
      type: object
      required: [id, document_kind, document_id, effective_at, reason]
      properties:
        id: { type: string }
        document_kind: { type: string, enum: [purchase, payment] }
        document_id: { type: string }
        effective_at: { type: string, format: date-time }
        reason: { type: string, minLength: 1, maxLength: 500 }
    Reversal:
      allOf:
        - { $ref: '#/components/schemas/ReversalInput' }
        - type: object
          required: [organization_id, status, original_journal_entry_id]
          properties:
            organization_id: { type: string }
            status: { type: string, enum: [requested, accounting_adjustment_required, accounting_adjustment_pending, reversed] }
            original_journal_entry_id: { type: string }
            reversal_journal_entry_id: { type: string, readOnly: true }
            accounting_failure: { $ref: '#/components/schemas/AccountingFailureRef' }
