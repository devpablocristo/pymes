name: v2-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  archive:
    name: archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable v1 snapshot
        run: .github/scripts/verify-v1-archive.sh v1-final
      - name: Verify frozen v1 tree
        run: .github/scripts/check-v1-frozen.sh

  dependency-boundary:
    name: dependency-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject local and unpublished dependencies
        run: .github/scripts/check-v2-dependencies.sh

  backend:
    name: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pymes
          POSTGRES_PASSWORD: pymes
          POSTGRES_DB: pymes_v2_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pymes -d pymes_v2_smoke"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    defaults:
      run:
        working-directory: v2/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: v2/backend/go.mod
          cache-dependency-path: v2/backend/go.sum
      - name: Test backend
        env:
          GOWORK: "off"
        run: go test ./...
      - name: Smoke health and readiness endpoints
        env:
          GOWORK: "off"
          PYMES_HTTP_ADDR: 127.0.0.1:18080
          PYMES_DATABASE_URL: postgres://pymes:pymes@127.0.0.1:5432/pymes_v2_smoke?sslmode=disable
        run: |
          go build -o "${RUNNER_TEMP}/pymes-v2-api" ./cmd/api
          "${RUNNER_TEMP}/pymes-v2-api" >"${RUNNER_TEMP}/pymes-v2-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "${api_pid}" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            if [[ "${attempt}" -eq 30 ]]; then
              cat "${RUNNER_TEMP}/pymes-v2-api.log"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:18080/readyz >/dev/null
          kill "${api_pid}"
          wait "${api_pid}"
          trap - EXIT
          grep -q '"event":"api_stopped_gracefully"' "${RUNNER_TEMP}/pymes-v2-api.log"

  db:
    name: db
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pymes
          POSTGRES_PASSWORD: pymes
          POSTGRES_DB: pymes_v2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pymes -d pymes_v2_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    defaults:
      run:
        working-directory: v2/db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: v2/db/go.mod
          cache-dependency-path: v2/db/go.sum
      - name: Test migrations from an empty database
        env:
          GOWORK: "off"
          PYMES_DATABASE_TEST_URL: postgres://pymes:pymes@127.0.0.1:5432/pymes_v2_test?sslmode=disable
        run: go test -count=1 ./...
      - name: Migrate twice, restart PostgreSQL, and remigrate
        env:
          GOWORK: "off"
          PYMES_DATABASE_URL: postgres://pymes:pymes@127.0.0.1:5432/pymes_v2_test?sslmode=disable
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          go run ./cmd/migrate
          go run ./cmd/migrate
          docker restart "${POSTGRES_CONTAINER}"
          for attempt in {1..30}; do
            if docker exec "${POSTGRES_CONTAINER}" pg_isready -U pymes -d pymes_v2_test; then
              break
            fi
            if [[ "${attempt}" -eq 30 ]]; then
              exit 1
            fi
            sleep 1
          done
          go run ./cmd/migrate

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: v2/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    name: compose
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the complete stack
        run: make up
      - name: Smoke the complete stack
        run: make smoke
      - name: Verify non-root application containers
        run: |
          docker compose exec -T backend sh -ec 'test "$(id -u)" != "0"'
          docker compose exec -T web sh -ec 'test "$(id -u)" != "0"'
          test -n "$(docker image inspect --format '{{.Config.User}}' "$(docker compose images -q migrate)")"
          test "$(docker image inspect --format '{{.Config.User}}' "$(docker compose images -q migrate)")" != "0"
      - name: Re-run migrations through the normal startup contract
        run: |
          docker compose exec -T postgres sh -ec \
            'test "$(psql -U pymes -d pymes_v2 -tAc "SELECT count(*) FROM schema_migrations WHERE scope = '\''pymes-v2'\''")" = 1'
          make up
          docker compose exec -T postgres sh -ec \
            'test "$(psql -U pymes -d pymes_v2 -tAc "SELECT count(*) FROM schema_migrations WHERE scope = '\''pymes-v2'\''")" = 1'
      - name: Verify readiness failure and recovery
        run: |
          docker compose stop postgres
          if curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null; then
            echo "readiness remained successful while PostgreSQL was stopped" >&2
            exit 1
          fi
          docker compose start postgres
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs backend postgres
          exit 1
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  v2-ci:
    name: v2-ci
    if: always()
    needs: [archive, dependency-boundary, backend, db, web, compose]
    runs-on: ubuntu-latest
    steps:
      - name: Require every v2 check
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "${RESULTS}" = "success success success success success success"
